<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage and monitor your smart home devices, network, and integrations.">
    <meta name="theme-color" content="#f3f5f8">

    <title>Dashboard | Smart Home</title>

    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/notifications.css">
</head>
<body>
    <div class="app-shell">

        <header class="app-header">
            <a class="app-brand" href="/dashboard" data-route="/dashboard">
                <span class="app-brand__icon" aria-hidden="true">⌂</span>
                <span>Smart Home</span>
            </a>

            <div class="app-header__actions">
                <div class="notification-menu" id="notification-menu">

                    <button
                        class="notification-menu__trigger"
                        id="notification-menu-trigger"
                        type="button"
                        aria-label="Notifications"
                        aria-expanded="false"
                        aria-controls="notification-menu-dropdown"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
                            <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
                        </svg>

                        <span
                            class="notification-menu__badge"
                            id="notification-menu-badge"
                            hidden
                        >0</span>
                    </button>

                    <div
                        class="notification-menu__dropdown"
                        id="notification-menu-dropdown"
                        hidden
                    >
                        <div class="notification-menu__header">
                            <h2 data-i18n="notifications.header.title">Notifications</h2>
                            <span
                                class="notification-menu__unread"
                                id="notification-menu-unread"
                            >0</span>
                        </div>

                        <div
                            class="notification-menu__list"
                            id="notification-menu-list"
                        >
                            <div class="notification-menu__empty">
                                <p data-i18n="notifications.header.empty">
                                    No notifications yet
                                </p>
                            </div>
                        </div>

                        <a
                            class="notification-menu__all"
                            href="/notifications"
                            data-route="/notifications"
                            data-i18n="notifications.header.viewAll"
                        >View all notifications</a>
                    </div>

                </div>
            </div>
        </header>

        <div class="app-body">

            <aside class="sidebar">
                <nav class="navigation" aria-label="Main navigation">

                    <a
                        class="navigation__link"
                        href="/dashboard"
                        data-route="/dashboard"
                    >
                        <img
                            class="nav-icon"
                            src="/assets/icons/dashboard.png"
                            alt=""
                            aria-hidden="true"
                        >
                        <span data-i18n="nav.dashboard">Dashboard</span>
                    </a>

                    <a
                        class="navigation__link"
                        href="/devices"
                        data-route="/devices"
                    >
                        <img
                            class="nav-icon"
                            src="/assets/icons/devices.png"
                            alt=""
                            aria-hidden="true"
                        >
                        <span data-i18n="nav.devices">Devices</span>
                    </a>

                    <a
                        class="navigation__link"
                        href="/network"
                        data-route="/network"
                    >
                        <img
                            class="nav-icon"
                            src="/assets/icons/network.png"
                            alt=""
                            aria-hidden="true"
                        >
                        <span data-i18n="nav.network">Network</span>
                    </a>

                    <a
                        class="navigation__link"
                        href="/zones"
                        data-route="/zones"
                    >
                        <img
                            class="nav-icon"
                            src="/assets/icons/zones.png"
                            alt=""
                            aria-hidden="true"
                        >
                        <span data-i18n="nav.zones">Zones</span>
                    </a>

                    <a
                        class="navigation__link"
                        href="/integrations"
                        data-route="/integrations"
                    >
                        <img
                            class="nav-icon"
                            src="/assets/icons/integrations.png"
                            alt=""
                            aria-hidden="true"
                        >
                        <span data-i18n="nav.integrations">Integrations</span>
                    </a>

                    <a
                        class="navigation__link"
                        href="/settings"
                        data-route="/settings"
                    >
                        <img
                            class="nav-icon"
                            src="/assets/icons/settings.png"
                            alt=""
                            aria-hidden="true"
                        >
                        <span data-i18n="nav.settings">Settings</span>
                    </a>

                </nav>
            </aside>

            <main
                id="app-content"
                class="app-content"
                tabindex="-1"
            >
                <p data-i18n="app.loading">Loading...</p>
            </main>

        </div>

        <footer class="app-footer">
            <span>Smart Home</span>
        </footer>

    </div>

    <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
