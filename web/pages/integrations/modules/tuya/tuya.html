<section class="integration-detail">
    <header class="page-header">
        <a class="back-link"
           href="/integrations"
           data-route="/integrations"
           data-i18n="integrations.backToIntegrations">
            ← Integrations
        </a>

        <h1 data-i18n="integrations.tuya">Tuya</h1>

        <p class="page-description"
           data-i18n="integrations.tuyaDescription">
            Connect Tuya-compatible smart devices.
        </p>
    </header>

    <div class="integrations-grid">
        <a class="integration-card"
           href="/integrations#tuya/cloud"
           data-route="/integrations#tuya/cloud">

            <div class="integration-card__header">
                <span class="integration-logo integration-logo--tuya">
                    Tuya
                </span>

                <span class="integration-status"
                      data-i18n="integrations.notConfigured">
                    Not configured
                </span>
            </div>

            <h3 data-i18n="integrations.cloud">Tuya Cloud</h3>

            <p data-i18n="integrations.cloudDescription">
                Connect through the Tuya cloud service.
            </p>
        </a>

        <a class="integration-card"
           href="/integrations#tuya/local"
           data-route="/integrations#tuya/local">

            <div class="integration-card__header">
                <span class="integration-logo integration-logo--tuya">
                    Tuya
                </span>

                <span class="integration-status"
                      data-i18n="integrations.notConfigured">
                    Not configured
                </span>
            </div>

            <h3 data-i18n="integrations.local">Tuya Local</h3>

            <p data-i18n="integrations.localDescription">
                Connect directly through your local network.
            </p>
        </a>
    </div>
</section>
