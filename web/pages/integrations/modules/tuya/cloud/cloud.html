<section class="integration-detail">
    <header class="page-header">
        <a class="back-link"
           href="/integrations#tuya"
           data-route="/integrations#tuya"
           data-i18n="integrations.backToTuya">
            ← Tuya
        </a>

        <h1 data-i18n="integrations.cloud">Tuya Cloud</h1>

        <p class="page-description"
           data-i18n="integrations.cloudDescription">
            Connect through the Tuya cloud service.
        </p>
    </header>

    <div class="integration-settings-card">
        <div class="integration-settings-card__header">
            <h2 data-i18n="integrations.connectionStatus">
                Connection status
            </h2>

            <span class="integration-status"
                  data-i18n="integrations.notConfigured">
                Not configured
            </span>
        </div>

        <p data-i18n="integrations.cloudSetupLater">
            Cloud connection settings will be added later.
        </p>
    </div>
</section>
