<section class="integration-detail">
    <header class="page-header">
        <a class="back-link"
           href="/integrations"
           data-route="/integrations"
           data-i18n="integrations.backToIntegrations">
            ← Integrations
        </a>

        <h1 data-i18n="integrations.tplink">TP-Link Router</h1>

        <p class="page-description"
           data-i18n="integrations.tplinkDescription">
            Connect your router through the local network.
        </p>
    </header>

    <div class="integration-settings-card">
        <div class="integration-settings-card__header">
            <h2 data-i18n="integrations.localConnection">
                Local connection
            </h2>

            <span class="integration-status"
                  data-i18n="integrations.notConfigured">
                Not configured
            </span>
        </div>

        <p data-i18n="integrations.tplinkSetupLater">
            Router connection settings will be added later.
        </p>
    </div>
</section>
