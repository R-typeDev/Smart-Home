<section class="integrations-page">
    <header class="page-header">
        <h1 data-i18n="integrations.title">Integrations</h1>
        <p class="page-description" data-i18n="integrations.description">
            Connect Smart Home to devices and services.
        </p>
    </header>

    <section class="integrations-group">
        <h2 data-i18n="integrations.devicePlatforms">Device platforms</h2>

        <div class="integrations-grid">
            <a class="integration-card"
               href="/integrations#tplink/router"
               data-route="/integrations#tplink/router">

                <div class="integration-card__header">
                    <span class="integration-logo integration-logo--tplink">
                        TP-Link
                    </span>
                    <span class="integration-status"
                          data-i18n="integrations.notConfigured">
                        Not configured
                    </span>
                </div>

                <h3 data-i18n="integrations.tplink">TP-Link Router</h3>

                <p data-i18n="integrations.tplinkDescription">
                    Connect your router through the local network.
                </p>

                <span class="integration-method">
                    <span aria-hidden="true">⌁</span>
                    <span data-i18n="integrations.localConnection">
                        Local connection
                    </span>
                </span>
            </a>

            <a class="integration-card"
               href="/integrations#tuya"
               data-route="/integrations#tuya">

                <div class="integration-card__header">
                    <span class="integration-logo integration-logo--tuya">
                        Tuya
                    </span>
                    <span class="integration-status"
                          data-i18n="integrations.notConfigured">
                        Not configured
                    </span>
                </div>

                <h3 data-i18n="integrations.tuya">Tuya</h3>

                <p data-i18n="integrations.tuyaDescription">
                    Connect Tuya-compatible smart devices.
                </p>

                <div class="integration-methods">
                    <span class="integration-method">
                        <span aria-hidden="true">☁</span>
                        Tuya Cloud
                    </span>

                    <span class="integration-method">
                        <span aria-hidden="true">⌁</span>
                        Tuya Local
                    </span>
                </div>
            </a>
        </div>
    </section>
</section>
