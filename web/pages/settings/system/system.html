<section class="system-page">

    <header class="page-header">
        <h1 data-i18n="system.title">System</h1>
        <p class="page-description" data-i18n="system.description">
            Monitor system status, services and maintenance.
        </p>
    </header>

    <section class="system-grid" aria-label="System sections">

        <!-- System Status: activity -->
        <article class="system-card">
            <div class="system-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>

            <div class="system-card__content">
                <h2 data-i18n="system.status.title">System Status</h2>
                <p data-i18n="system.status.description">
                    Overview of the system's current state and health.
                </p>
            </div>
        </article>

        <!-- Services: layers -->
        <article class="system-card">
            <div class="system-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="m12 2 9 5-9 5-9-5 9-5Z"/>
                    <path d="m3 12 9 5 9-5"/>
                    <path d="m3 17 9 5 9-5"/>
                </svg>
            </div>

            <div class="system-card__content">
                <h2 data-i18n="system.services.title">Services</h2>
                <p data-i18n="system.services.description">
                    View system services and their operation.
                </p>
            </div>
        </article>

        <!-- Maintenance: wrench -->
        <article class="system-card">
            <div class="system-card__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94L14.7 6.3Z"/>
                </svg>
            </div>

            <div class="system-card__content">
                <h2 data-i18n="system.maintenance.title">Maintenance</h2>
                <p data-i18n="system.maintenance.description">
                    System maintenance and diagnostic tools.
                </p>
            </div>
        </article>

    </section>
</section>
