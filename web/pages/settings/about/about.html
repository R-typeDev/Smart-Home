
<section class="about-page">

    <header class="page-header">
        <h1 data-i18n="about.title">About</h1>

        <p class="page-description" data-i18n="about.description">
            Information about your Smart Home application.
        </p>
    </header>

    <section class="about-card">

        <div class="about-brand">
            <span class="app-brand__icon" aria-hidden="true">⌂</span>

            <h2>Smart Home</h2>

            <p data-i18n="about.subtitle">
                Home Automation System
            </p>
        </div>

        <div class="about-status">
            <span
                class="about-status__indicator"
                id="about-status-indicator"
            ></span>

            <span
                id="about-status-text"
                data-i18n="dashboard.checking"
            >
                Checking system status...
            </span>
        </div>

        <div class="about-information">

            <div class="about-information__row">
                <span data-i18n="about.application">Application</span>
                <strong>Smart Home</strong>
            </div>

            <div class="about-information__row">
                <span data-i18n="about.version">Version</span>
                <strong>0.1.0</strong>
            </div>

            <div class="about-information__row">
                <span data-i18n="about.platform">Platform</span>
                <strong data-i18n="about.platformValue">
                    Home Automation
                </strong>
            </div>

            <div class="about-information__row">
                <span data-i18n="about.license">License</span>
                <strong data-i18n="about.licenseValue">
                    To be determined
                </strong>
            </div>

        </div>

        <div class="about-last-check">
            <span data-i18n="dashboard.lastCheck">Last check:</span>
            <time id="about-last-check">—</time>
        </div>

    </section>

</section>
