
<section class="settings-general-page">

    <header class="page-header">
        <h1>General</h1>
        <p class="page-description">
            Manage general application preferences.
        </p>
    </header>

    <section class="settings-general-section">

        <div class="settings-general-section__header">
            <div class="settings-general-section__title">
                <span class="settings-general-section__icon">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
                        <path d="M2 12h20"/>
                    </svg>
                </span>
                <h2>Language</h2>
            </div>
        </div>

        <div class="settings-general-row">
            <div class="settings-general-row__content">
                <p>Application display language</p>
            </div>

            <div class="settings-general-row__control">
                <select
                    id="language-select"
                    class="settings-general-language"
                    aria-label="Application display language">

                    <option value="en">English</option>
                    <option value="ru">Русский</option>

                </select>
            </div>
        </div>

    </section>

</section>
