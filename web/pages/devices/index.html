<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage smart home devices.">
    <title>Devices | Smart Home</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Devices</h1>
    </header>

    <main>
        <p>Manage connected devices.</p>

        <section class="device-card" aria-labelledby="plug-name">
            <h2 id="plug-name">Smart Plug</h2>

            <p>
                Connection:
                <span id="plug-connection">Checking...</span>
            </p>

            <p>
                Power:
                <span id="plug-power">Checking...</span>
            </p>

            <p id="plug-message" role="status" aria-live="polite"></p>

            <button id="plug-on" type="button" disabled>
                Turn On
            </button>

            <button id="plug-off" type="button" disabled>
                Turn Off
            </button>
        </section>
    </main>

    <footer>
        <p>Smart Home</p>
    </footer>

    <script>
        const connectionElement =
            document.getElementById("plug-connection");
        const powerElement =
            document.getElementById("plug-power");
        const messageElement =
            document.getElementById("plug-message");
        const onButton =
            document.getElementById("plug-on");
        const offButton =
            document.getElementById("plug-off");

        async function loadPlugStatus() {
            try {
                const response = await fetch("/api/devices/plug");

                if (!response.ok) {
                    throw new Error("Status request failed");
                }

                const data = await response.json();

                connectionElement.textContent =
                    data.online ? "Online" : "Offline";

                powerElement.textContent =
                    data.power === true ? "On" :
                    data.power === false ? "Off" : "Unknown";

                onButton.disabled = !data.online || data.power === true;
                offButton.disabled = !data.online || data.power === false;
            } catch {
                connectionElement.textContent = "Unavailable";
                powerElement.textContent = "Unknown";
                onButton.disabled = true;
                offButton.disabled = true;
            }
        }

        async function setPlugPower(action) {
            onButton.disabled = true;
            offButton.disabled = true;
            messageElement.textContent = "Sending command...";

            try {
                const response = await fetch(
                    `/api/devices/plug/${action}`,
                    { method: "POST" }
                );

                if (!response.ok) {
                    throw new Error("Command failed");
                }

                await loadPlugStatus();
                messageElement.textContent = "Command completed.";
            } catch {
                messageElement.textContent =
                    "Command failed. Check the connection and try again.";
                await loadPlugStatus();
            }
        }

        onButton.addEventListener("click", () => setPlugPower("on"));
        offButton.addEventListener("click", () => setPlugPower("off"));

        loadPlugStatus();
    </script>
</body>
</html>
