
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Device details and controls in the Smart Home system.">
    <title>Device | Smart Home</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header>
        <h1 id="device-name">Device</h1>
    </header>

    <main>
        <section class="device-card" aria-labelledby="device-name">
            <h2>Device information</h2>

            <p>Type: <span id="device-type">Loading...</span></p>
            <p>Manufacturer: <span id="device-manufacturer">Loading...</span></p>
            <p>Model: <span id="device-model">Loading...</span></p>
            <p>Integration: <span id="device-integration">Loading...</span></p>
            <p>External ID: <span id="device-external-id">Loading...</span></p>
            <p>Configuration: <span id="device-enabled">Loading...</span></p>

            <h2>Device status</h2>

            <p id="connection-row">
                Connection: <span id="device-connection">Not checked</span>
            </p>

            <p id="power-row">
                Power: <span id="device-power">Not checked</span>
            </p>

            <p id="device-message" role="status" aria-live="polite"></p>

            <div id="device-controls">
                <button id="device-on" type="button" disabled>
                    Turn On
                </button>

                <button id="device-off" type="button" disabled>
                    Turn Off
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>Smart Home</p>
    </footer>

    <script>
        let currentDevice = null;
        let controlAvailable = false;
        let commandInProgress = false;
        let statusCheckInProgress = false;
        let currentPower = null;

        const deviceName = document.getElementById("device-name");
        const connectionRow = document.getElementById("connection-row");
        const powerRow = document.getElementById("power-row");
        const connectionElement = document.getElementById("device-connection");
        const powerElement = document.getElementById("device-power");
        const messageElement = document.getElementById("device-message");
        const controlsElement = document.getElementById("device-controls");
        const onButton = document.getElementById("device-on");
        const offButton = document.getElementById("device-off");

        function getDeviceIdFromPath() {
            const pathParts = window.location.pathname
                .split("/")
                .filter(Boolean);

            const itemIndex = pathParts.indexOf("item");

            return itemIndex !== -1
                ? pathParts[itemIndex + 1]
                : null;
        }

        async function requestJson(url, options = {}) {
            const response = await fetch(url, options);
            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(result.detail || "Request failed.");
            }

            return result;
        }

        function updateButtonState() {
            const unavailable = !controlAvailable || commandInProgress;

            onButton.disabled = unavailable || currentPower === true;
            offButton.disabled = unavailable || currentPower === false;
        }

        function isTuyaCandidate(device) {
            return (
                device.enabled === 1 &&
                device.integration_id === "tuya" &&
                Boolean(device.external_id)
            );
        }

        function isRouter(device) {
            return (
                device.type === "router" &&
                device.integration_id === "tplink_router"
            );
        }

        function hidePowerControls() {
            powerRow.hidden = true;
            controlsElement.hidden = true;
            controlAvailable = false;
            currentPower = null;
            updateButtonState();
        }

        async function loadDevice() {
            const deviceId = getDeviceIdFromPath();

            if (!deviceId) {
                messageElement.textContent = "Device ID is missing.";
                return;
            }

            try {
                currentDevice = await requestJson(
                    `/api/devices/${encodeURIComponent(deviceId)}`
                );

                deviceName.textContent = currentDevice.name;
                document.title = `${currentDevice.name} | Smart Home`;

                document.getElementById("device-type").textContent =
                    currentDevice.type || "Not specified";

                document.getElementById("device-manufacturer").textContent =
                    currentDevice.manufacturer || "Not specified";

                document.getElementById("device-model").textContent =
                    currentDevice.model || "Not specified";

                document.getElementById("device-integration").textContent =
                    currentDevice.integration_id || "Not assigned";

                document.getElementById("device-external-id").textContent =
                    currentDevice.external_id || "Not specified";

                document.getElementById("device-enabled").textContent =
                    currentDevice.enabled === 1 ? "Enabled" : "Disabled";

                if (isRouter(currentDevice)) {
                    powerRow.hidden = true;
                    controlsElement.hidden = true;
                    controlAvailable = false;
                    currentPower = null;
                    updateButtonState();

                    messageElement.textContent = "Checking router availability...";
                    await loadRouterStatus();
                    return;
                }

                if (isTuyaCandidate(currentDevice)) {
                    connectionRow.hidden = false;
                    powerRow.hidden = false;
                    controlsElement.hidden = false;

                    messageElement.textContent = "Checking device availability...";
                    await loadDeviceStatus();
                    return;
                }

                controlAvailable = false;
                currentPower = null;
                updateButtonState();

                connectionElement.textContent = "Not available";
                powerElement.textContent = "Not available";
                messageElement.textContent =
                    "Status and control are not configured for this device.";
            } catch (error) {
                currentDevice = null;
                controlAvailable = false;
                currentPower = null;
                updateButtonState();

                deviceName.textContent = "Device";
                messageElement.textContent =
                    `Could not load device details: ${error.message}`;

                console.error(error);
            }
        }

        async function loadRouterStatus() {
            if (!currentDevice || !isRouter(currentDevice)) {
                return;
            }

            try {
                const result = await requestJson(
                    `/api/network/${encodeURIComponent(currentDevice.id)}`
                );

                connectionElement.textContent =
                    result.online === true
                        ? "Online"
                        : result.online === false
                            ? "Offline"
                            : "Unavailable";

                messageElement.textContent = "";
            } catch (error) {
                connectionElement.textContent = "Unavailable";
                messageElement.textContent =
                    `Could not retrieve router status: ${error.message}`;
            }
        }

        async function loadDeviceStatus() {
            if (
                !currentDevice ||
                !isTuyaCandidate(currentDevice) ||
                statusCheckInProgress
            ) {
                return false;
            }

            statusCheckInProgress = true;

            try {
                const status = await requestJson(
                    `/api/devices/${encodeURIComponent(currentDevice.id)}/status`
                );

                connectionElement.textContent =
                    status.online ? "Online" : "Offline";

                if (status.power === true) {
                    currentPower = true;
                    powerElement.textContent = "On";
                } else if (status.power === false) {
                    currentPower = false;
                    powerElement.textContent = "Off";
                } else {
                    currentPower = null;
                    powerElement.textContent = "Unknown";
                }

                controlAvailable =
                    status.online === true && currentPower !== null;

                updateButtonState();

                messageElement.textContent = controlAvailable
                    ? ""
                    : "Device status is unavailable for control.";

                return controlAvailable;
            } catch (error) {
                controlAvailable = false;
                currentPower = null;
                updateButtonState();

                connectionElement.textContent = "Unavailable";
                powerElement.textContent = "Unknown";
                messageElement.textContent =
                    `Control unavailable: ${error.message}`;

                return false;
            } finally {
                statusCheckInProgress = false;
            }
        }

        async function setDevicePower(action) {
            if (
                !currentDevice ||
                !isTuyaCandidate(currentDevice) ||
                !controlAvailable ||
                commandInProgress ||
                statusCheckInProgress ||
                !["on", "off"].includes(action)
            ) {
                return;
            }

            if (
                (action === "on" && currentPower === true) ||
                (action === "off" && currentPower === false)
            ) {
                return;
            }

            commandInProgress = true;
            updateButtonState();
            messageElement.textContent = "Sending command...";

            try {
                await requestJson(
                    `/api/devices/${encodeURIComponent(currentDevice.id)}/${action}`,
                    { method: "POST" }
                );

                await loadDeviceStatus();
            } catch (error) {
                messageElement.textContent =
                    `Could not control device: ${error.message}`;

                await loadDeviceStatus();
            } finally {
                commandInProgress = false;
                updateButtonState();
            }
        }

        onButton.addEventListener("click", () => {
            setDevicePower("on");
        });

        offButton.addEventListener("click", () => {
            setDevicePower("off");
        });

        loadDevice();

        // Refresh the relevant status every five seconds.
        setInterval(() => {
            if (!currentDevice || commandInProgress) {
                return;
            }

            if (isRouter(currentDevice)) {
                loadRouterStatus();
            } else if (isTuyaCandidate(currentDevice)) {
                loadDeviceStatus();
            }
        }, 5000);
    </script>
</body>
</html>
