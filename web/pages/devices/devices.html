<section class="devices-page" aria-labelledby="devices-title">
    <header class="page-header">
        <h1 id="devices-title" data-i18n="pages.devices">Devices</h1>
        <p class="page-description">
            All registered devices in your Smart Home system.
        </p>
    </header>

    <div
        id="devices-message"
        class="devices-message"
        role="status"
        aria-live="polite"
        hidden
    ></div>

    <div
        id="devices-list"
        class="devices-list"
        aria-label="Registered devices"
    ></div>

    <button
        id="devices-retry"
        class="devices-retry"
        type="button"
        hidden
    >
        Retry
    </button>
</section>
