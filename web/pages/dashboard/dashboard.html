
<section class="dashboard">
    <header class="dashboard__header">
        <h1 data-i18n="dashboard.title">Dashboard</h1>

        <p
            class="dashboard__subtitle"
            data-i18n="dashboard.description"
        >
            An overview of your smart home system.
        </p>
    </header>

    <div
        class="dashboard-grid"
        id="dashboard-grid"
        aria-label="Smart home overview"
    >
        <!-- Clock widget -->
        <article class="dashboard-card dashboard-card--clock">
            <div class="dashboard-card__header">
                <h2 data-i18n="dashboard.clock">Current time</h2>
            </div>

            <div class="dashboard-clock">
                <div id="dashboard-clock-time">00:00:00</div>
                <div id="dashboard-clock-date"></div>
            </div>
        </article>
    </div>
</section>
