<section class="network-page" aria-labelledby="network-title">
    <header class="page-header">
        <h1 id="network-title" data-i18n="pages.network">Network</h1>
        <p class="page-description">
            Network devices registered in your Smart Home system.
        </p>
    </header>

    <div
        id="network-message"
        class="network-message"
        role="status"
        aria-live="polite"
        hidden
    ></div>

    <div
        id="network-list"
        class="network-list"
        aria-label="Network devices"
    ></div>

    <button
        id="network-retry"
        class="network-retry"
        type="button"
        hidden
    >
        Retry
    </button>
</section>
