<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage smart home devices.">
    <title>Devices | Smart Home</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Devices</h1>
        <p>Manage connected devices.</p>
    </header>

    <main>
        <section>
            <h2>Add device</h2>

            <form id="device-form">
                <div>
                    <label for="device-name">Name</label>
                    <input
                        type="text"
                        id="device-name"
                        name="name"
                        required
                    >
                </div>

                <div>
                    <label for="device-type">Type</label>
                    <input
                        type="text"
                        id="device-type"
                        name="type"
                        required
                    >
                </div>

                <div>
                    <label for="device-manufacturer">Manufacturer</label>
                    <input
                        type="text"
                        id="device-manufacturer"
                        name="manufacturer"
                    >
                </div>

                <div>
                    <label for="device-model">Model</label>
                    <input
                        type="text"
                        id="device-model"
                        name="model"
                    >
                </div>

                <div>
                    <label for="device-external-id">External ID</label>
                    <input
                        type="text"
                        id="device-external-id"
                        name="external_id"
                    >
                </div>

                <div>
                    <label for="device-integration">Integration</label>
                    <select
                        id="device-integration"
                        name="integration_id"
                    >
                        <option value="">No integration</option>
                    </select>
                </div>

                <button type="submit" id="add-device-button">
                    Add device
                </button>

                <p id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section>
            <h2>Registered devices</h2>

            <ul id="devices-list">
                <li>Loading devices...</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Smart Home</p>
    </footer>

    <script>
        async function loadIntegrations() {
            const integrationSelect = document.getElementById(
                "device-integration"
            );

            const addButton = document.getElementById(
                "add-device-button"
            );

            try {
                const response = await fetch("/api/integrations");

                if (!response.ok) {
                    throw new Error("Failed to load integrations.");
                }

                const integrations = await response.json();

                integrationSelect.replaceChildren();

                const noIntegrationOption = document.createElement("option");
                noIntegrationOption.value = "";
                noIntegrationOption.textContent = "No integration";
                integrationSelect.appendChild(noIntegrationOption);

                integrations
                    .filter((integration) => integration.enabled === 1)
                    .forEach((integration) => {
                        const option = document.createElement("option");

                        option.value = integration.id;
                        option.textContent = integration.name;

                        integrationSelect.appendChild(option);
                    });

                integrationSelect.disabled = false;
                addButton.disabled = false;
            } catch (error) {
                integrationSelect.replaceChildren();

                const option = document.createElement("option");
                option.value = "";
                option.textContent = "Failed to load integrations";
                integrationSelect.appendChild(option);

                integrationSelect.disabled = true;
                addButton.disabled = true;

                document.getElementById("form-message").textContent =
                    "Could not load integrations. Refresh the page to try again.";

                console.error(error);
            }
        }

        async function loadDevices() {
            const devicesList = document.getElementById("devices-list");

            try {
                const response = await fetch("/api/devices");

                if (!response.ok) {
                    throw new Error("Failed to load devices.");
                }

                const devices = await response.json();

                devicesList.replaceChildren();

                if (devices.length === 0) {
                    const item = document.createElement("li");
                    item.textContent = "No devices added yet.";
                    devicesList.appendChild(item);
                    return;
                }

                devices.forEach((device) => {
                    const item = document.createElement("li");
                    const link = document.createElement("a");

                    link.href =
                        `/pages/devices/item/${encodeURIComponent(device.id)}/`;

                    link.textContent =
                        `${device.name} (${device.type})`;

                    item.appendChild(link);
                    devicesList.appendChild(item);
                });
            } catch (error) {
                devicesList.replaceChildren();

                const item = document.createElement("li");
                item.textContent = "Failed to load devices.";
                devicesList.appendChild(item);

                console.error(error);
            }
        }

        document
            .getElementById("device-form")
            .addEventListener("submit", async (event) => {
                event.preventDefault();

                const form = event.currentTarget;
                const message = document.getElementById("form-message");
                const submitButton = document.getElementById(
                    "add-device-button"
                );

                const formData = new FormData(form);
                const selectedIntegrationId = formData
                    .get("integration_id")
                    .trim();

                const device = {
                    name: formData.get("name").trim(),
                    type: formData.get("type").trim(),
                    manufacturer: formData.get("manufacturer").trim(),
                    model: formData.get("model").trim(),
                    external_id: formData.get("external_id").trim() || null,
                    integration_id: selectedIntegrationId || null
                };

                message.textContent = "";
                submitButton.disabled = true;

                try {
                    const response = await fetch("/api/devices", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(device)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.detail || "Failed to add device."
                        );
                    }

                    message.textContent = "Device added successfully.";
                    form.reset();

                    await loadDevices();
                } catch (error) {
                    message.textContent = error.message;
                    console.error(error);
                } finally {
                    submitButton.disabled = false;
                }
            });

        async function initializePage() {
            await loadIntegrations();
            await loadDevices();
        }

        initializePage();
    </script>
</body>
</html>
